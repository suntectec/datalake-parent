env {
  parallelism = 1
  job.name = "SqlServer CDC to SqlServer"
  job.mode = "STREAMING"
  checkpoint.interval = 10000
}

source {
  SqlServer-CDC {
    plugin_output = "customers"

    base-url = "jdbc:sqlserver://192.168.138.15:1433;databaseName=inventory"
    # startup.mode="initial"
    startup.mode="latest"

    exactly_once = true
    username = "SA"
    password = "Abcd1234"
    database-names = ["inventory"]
    table-names = ["inventory.INV.orders"]
    table-names-config = [
      {
        table = "inventory.INV.orders"
        primaryKeys = ["id"]
      }
    ]

  }
}

sink{
    Jdbc {
      plugin_input = "customers"
      driver = com.microsoft.sqlserver.jdbc.SQLServerDriver
      url = "jdbc:sqlserver://192.168.138.15:14330;databaseName=TestDB"
      user = SA
      password = "YourStrong!Passw0rd"
      generate_sink_sql = true
      database = "TestDB"
      table = "dbo.orders_sink"
      batch_size = 100
      primary_keys = ["id"]
    }
}