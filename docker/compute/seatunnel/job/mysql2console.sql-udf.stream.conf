env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 10000
}

source {
  MySQL-CDC {
    plugin_output = "fake"
    base-url = "jdbc:mysql://192.168.138.15:3306/inventory"
    username = "root"
    password = "123456"
    table-names = ["inventory.customers"]

    startup.mode = "initial"
  }
}

transform {
  Sql {
    plugin_input = "fake"
    plugin_output = "fake1"
    query = "select id, example(first_name) as first_name from fake where id>0"
  }
}

sink {
  Console {
    plugin_input = "fake1"
  }
}