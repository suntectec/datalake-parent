env {
  parallelism = 1
  job.name = "SqlServer CDC to Compatible Debezium"
  job.mode = "STREAMING"
  checkpoint.interval = 10000
}

source {
  SqlServer-CDC {
    # plugin_output = "table1"

    base-url = "jdbc:sqlserver://192.168.138.15:1433;databaseName=inventory"
    # startup.mode="initial"
    startup.mode="latest"

    exactly_once = true
    username = "SA"
    password = "Abcd1234"
    database-names = ["inventory"]
    table-names = ["inventory.INV.orders"]
    table-names-config = [
      {
        table = "inventory.INV.orders"
        primaryKeys = ["id"]
      }
    ]

    # compatible_debezium_json options
    format = compatible_debezium_json
    debezium = {
        # include schema into kafka message
        key.converter.schemas.enable = false
        value.converter.schemas.enable = false
        # topic prefix
        database.server.name =  "sqlserver_cdc_1"

        # Controls whether a delete event is followed by a tombstone event.
        # true - a delete operation is represented by a delete event and a subsequent tombstone event.
        # tombstones.on.delete = false - only a delete event is emitted.
        tombstones.on.delete = false
    }
  }
}

sink{
    Console{
        # plugin_input = "table1"
    }
}