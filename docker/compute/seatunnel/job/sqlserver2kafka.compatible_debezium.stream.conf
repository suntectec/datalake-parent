env {
  parallelism = 1
  job.name = "SqlServer CDC Format Compatible Debezium-json"
  job.mode = "STREAMING"
  checkpoint.interval = 10000
}

source {
  SqlServer-CDC {
    base-url = "jdbc:sqlserver://192.168.138.15:1433;databaseName=inventory"
    # startup.mode="initial"
    startup.mode = "latest"

    exactly_once = true
    username = "SA"
    password = "Abcd1234"
    database-names = ["inventory"]
    table-names = ["inventory.INV.orders"]
    table-names-config = [
      {
        table = "inventory.INV.orders"
        primaryKeys = ["id"]
      }
    ]

    # compatible_debezium_json options
    format = compatible_debezium_json
    debezium = {
        # include schema into kafka message
        key.converter.schemas.enable = false
        value.converter.schemas.enable = false
        # topic prefix
        database.server.name =  "CompatibleDebezium"

        # tombstones.on.delete = false - only a delete event is emitted. no a subsequent tombstone event.
        tombstones.on.delete = false
    }
  }
}

sink {
  Kafka {
    bootstrap.servers = "192.168.138.15:9092"
    topic = "${topic}"
    # compatible_debezium_json options
    format = compatible_debezium_json
  }
}